<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>지렁이 게임</title>
  <link rel="stylesheet" href="style1.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>지렁이 게임</h1>
  <canvas id="game" width="400" height="400"></canvas>

  <div class="score">점수: <span id="score">0</span></div>

  <div class="settings">
    <label>
      난이도:
      <select id="difficulty">
        <option value="normal">노말</option>
        <option value="hard">하드</option>
        <option value="extreme">익스트림</option>
      </select>
    </label>
    <label>
      모드:
      <select id="mode">
        <option value="normal">기본</option>
        <option value="obstacle">장애물</option>
      </select>
    </label>
    <label>
      지렁이 색상:
      <input type="color" id="snakeColor" value="#00ff00" />
    </label>
    <label>
      테마:
      <select id="theme">
        <option value="dark">다크</option>
        <option value="light">라이트</option>
      </select>
    </label>
    <button id="startBtn">게임 시작</button>
    <button id="restartBtn" style="display:none">다시 시작</button>
  </div>

  <div class="controls">
    <div>
      <button onclick="setDirection('up')">↑</button>
    </div>
    <div>
      <button onclick="setDirection('left')">←</button>
      <button onclick="setDirection('down')">↓</button>
      <button onclick="setDirection('right')">→</button>
    </div>
  </div>

  <div class="ranking">
    <h2>랭킹</h2>
    <ol id="rankingList"></ol>
  </div>

  <audio id="bgm" loop>
    <source src="bgm.mp3" type="audio/mpeg" />
  </audio>
  <audio id="eatSound">
    <source src="eat.mp3" type="audio/mpeg" />
  </audio>
  <audio id="gameOverSound">
    <source src="gameover.mp3" type="audio/mpeg" />
  </audio>

  <script src="script1_main.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
  </script>
</body>
</html>
